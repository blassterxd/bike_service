{% extends "base.html" %}
{% block title %}{{ service.name }}{% endblock %}
{% block content %}
<h1>{{ service.name }}</h1>
<p>{{ service.description }}</p>
<p>Время выполнения — {{ service.duration }}</p>
<p><strong>Цена — {{ service.price }} ₽ за единицу</strong></p>
<a href="{{ url_for('menu') }}">Вернуться в каталог</a>
{% endblock %}
