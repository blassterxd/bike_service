{% extends "base.html" %}
{% block content %}
<h1>Каталог услуг</h1>
<div class="cards">
    {% for slug, service in services.items() %}
    <article class="card">
        <h2><a href="{{ url_for('service_detail', slug=slug) }}">{{ service.name }}</a></h2>
        <p>Время работы: {{ service.duration }}</p>
        <strong>{{ service.price }} ₽</strong>
    </article>
    {% endfor %}
</div>
{% endblock %}
